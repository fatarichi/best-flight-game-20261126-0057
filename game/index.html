<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Coral Coast Run — a chase-view flight game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #06283f;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    touch-action: none;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    letter-spacing: 0.04em;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">W/S pitch &nbsp;·&nbsp; A/D bank &nbsp;·&nbsp; R/F throttle &nbsp;·&nbsp; SPACE airbrake &nbsp;·&nbsp; G gear &nbsp;·&nbsp; P pause</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
